<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activate Your Account - AtlasStay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f1f5f5;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 128, 128, 0.1);
        }

        .logo {
            font-size: 28px;
            text-align: center;
            margin-bottom: 30px;
        }

        .logo strong {
            color: #0f766e;
            font-size: 34px;
        }

        .logo span {
            color: #14b8a6;
        }

        h1 {
            font-size: 24px;
            color: #0f766e;
            text-align: center;
            margin-bottom: 20px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
        }

        .activation-code {
            font-size: 28px;
            font-weight: bold;
            color: #0f766e;
            text-align: center;
            margin: 24px 0;
            padding: 12px 20px;
            background-color: #e0f2f1;
            border: 2px dashed #0f766e;
            border-radius: 8px;
            font-family: monospace;
        }

        .activation-link {
            text-align: center;
            margin: 30px 0;
        }

        .activation-link a {
            display: inline-block;
            padding: 12px 24px;
            background-color: #14b8a6;
            color: #ffffff;
            font-size: 16px;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .activation-link a:hover {
            background-color: #0f766e;
        }

        .footer {
            margin-top: 40px;
            font-size: 14px;
            text-align: center;
            color: #888;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <strong>Atlas</strong><span>Stay</span>
    </div>

    <h1>Activate Your Account</h1>

    <p>Hi <span th:text="${username}">[Username]</span>,</p>

    <p>Thanks for registering with <strong>AtlasStay</strong>! To complete your account setup, please use the activation code below:</p>

    <div class="activation-code">
        <span th:text="${activation_code}">123456</span>
    </div>

    <p>If you didn't request this registration, you can safely ignore this message.</p>

    <div class="footer">
        &copy; 2025 AtlasStay. All rights reserved.
    </div>
</div>
</body>
</html>
